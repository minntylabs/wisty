name: Set up build environment
description: >
  Installs the system libraries, Rust and Node that both CI jobs need. Kept in
  one place because a missing package here fails in a way that looks nothing
  like a packaging problem: alsa-sys, for instance, reports only that
  pkg-config could not find a library.

runs:
  using: composite
  steps:
    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          libgtk-3-dev \
          librsvg2-dev \
          libayatana-appindicator3-dev \
          libasound2-dev \
          libclang-dev \
          patchelf \
          file \
          build-essential

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust build
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: src-tauri

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm

    - name: Install npm dependencies
      shell: bash
      run: npm ci
