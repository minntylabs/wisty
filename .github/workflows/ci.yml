name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Pushes in quick succession would otherwise queue runs whose results are stale
# before they finish. Only the newest commit on a ref is worth checking.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up build environment
        uses: ./.github/actions/setup

      - name: Test, typecheck and lint
        run: npm run verify

  # Bundling takes minutes and mostly re-proves what verify already proved, so
  # it runs where its answer matters: on a release tag, and on demand when you
  # want to check that the app still packages.
  bundle:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up build environment
        uses: ./.github/actions/setup

      - name: Build application bundles
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm run tauri:bundle
