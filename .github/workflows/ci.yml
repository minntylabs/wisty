name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A bundle build takes minutes, so pushes in quick succession would otherwise
# queue up runs whose results are stale before they finish. Only the newest
# commit on a ref is worth building.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libasound2-dev \
            libclang-dev \
            patchelf \
            file \
            build-essential

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Test, typecheck and lint
        run: npm run verify

      - name: Build application bundles
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm run tauri:bundle
