[package]
name = "wisty"
version = "2.5.0"
description = "Plain text editor"
license = "GPL-3.0-or-later"
authors = ["Wisty contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wisty_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-log = "2"
gtk = "0.18"
log = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hunspell-rs = "0.4.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
symphonia = { version = "0.6.0", features = ["aac", "isomp4"] }
# Playback only: spans are decoded by symphonia and handed over as a finished
# buffer, so rodio drives the device and nothing else. Its default features
# pull in a stack of decoders that would duplicate symphonia's job.
rodio = { version = "0.22", default-features = false, features = ["playback"] }
